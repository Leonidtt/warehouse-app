name: Flash lifecycle regression
on:
  push:
    branches:
      - flash-numbering-20261121
      - main
    paths:
      - 'backend/flash_lifecycle.py'
      - 'backend/flash_lifecycle_ui.js'
      - 'backend/main.py'
      - 'backend/release_v183.py'
      - 'backend/warehouse_v18.py'
      - 'backend/tests/test_flash_lifecycle.py'
      - '.github/workflows/flash-lifecycle.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install --disable-pip-version-check fastapi 'httpx>=0.27,<1'
      - name: Check Python syntax
        run: python -m py_compile backend/flash_lifecycle.py backend/main.py backend/release_v183.py backend/warehouse_v18.py
      - name: Run isolated SQLite lifecycle regression tests
        run: python -m unittest discover -s backend/tests -p 'test_flash_lifecycle.py' -v
      - name: Check client JavaScript syntax
        run: node --check backend/flash_lifecycle_ui.js
      - name: Install Main runtime dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Cold-start Main on a throwaway SQLite database
        run: |
          sudo mkdir -p /data
          sudo chown "$USER":"$USER" /data
          python backend/tests/smoke_main_bootstrap.py
