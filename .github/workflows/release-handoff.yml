name: Сводка релиза Основы

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment.environment == 'vigilant-art / production' &&
       github.event.deployment_status.creator.login == 'railway-app[bot]' &&
       github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false
      - name: Сверить версию и входы Основы
        shell: bash
        run: |
          result=0
          python3 scripts/release_handoff.py --wait 60 > handoff.json || result=$?
          if [[ -s handoff.json ]]; then
            printf '::notice title=handoff.json::%s\n' "$(<handoff.json)"
          fi
          exit "$result"
      - name: Сохранить результат для следующего чата
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: warehouse-handoff-${{ github.event.deployment.sha || github.sha }}
          path: handoff.json
          if-no-files-found: error
          retention-days: 30
