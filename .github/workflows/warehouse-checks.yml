name: Проверки склада

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: warehouse-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Склад, выдача и возврат
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Установить зависимости
        run: python -m pip install -r backend/requirements.txt
      - name: Проверить склад на временной базе
        run: python scripts/smoke_warehouse.py
      - name: Проверить синтаксис JavaScript
        # app.js is a legacy file and neither current entry point serves it.
        run: git ls-files -z -- 'backend/*.js' ':!backend/app.js' | xargs -0 -n 1 node --check
