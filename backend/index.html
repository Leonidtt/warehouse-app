<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; }
        h1 { font-size: 20px; margin: 0 0 16px; }
        h2 { font-size: 15px; margin: 16px 0 8px; color: #555; }
        button { width: 100%; padding: 14px; margin-bottom: 10px; border: none; border-radius: 10px; font-size: 16px; background: #2AABEE; color: white; cursor: pointer; }
        button.secondary { background: #fff; color: #333; border: 1px solid #ddd; }
        button.danger { background: #e74c3c; }
        button.ok { background: #27ae60; }
        .card { background: #fff; padding: 14px; border-radius: 10px; margin-bottom: 10px; display: flex; gap: 10px; }
        .card .info { flex: 1; }
        .card .name { font-weight: 600; }
        .card .meta { color: #666; font-size: 14px; margin-top: 4px; }
        .card.low-stock { border: 2px solid #e74c3c; background: #fdf2f2; }
        .card img.thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; background: #eee; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; background: #fff; }
        textarea { font-family: monospace; resize: vertical; }
        .hidden { display: none; }
        .stock-line, .holder-line { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid #eee; font-size: 14px; }
        .stock-line:first-child, .holder-line:first-child { border-top: none; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; background: #eee; color: #555; }
        .badge.eq { background: #e3f2fd; color: #1565c0; }
        .badge.cons { background: #fff3e0; color: #e65100; }
        .qr-text-box { background: #fff; padding: 15px; border-radius: 8px; border: 2px dashed #ccc; margin-top: 15px; text-align: center; }
        .qr-text-box .label { font-size: 13px; color: #888; margin-bottom: 5px; }
        .qr-text-box .value { font-size: 24px; font-weight: bold; font-family: monospace; color: #000; user-select: all; }
        .search-box { margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="screen-main">
        <h1>Учёт</h1>
        <input class="search-box" type="text" id="search-input" placeholder="🔍 Поиск по названию или коду..." oninput="filterItems()">
        <button onclick="scanQr()">📷 Сканировать QR</button>
        <button class="secondary" onclick="showAddForm()">➕ Добавить товар</button>
        <button class="secondary" onclick="showOnHand()">🖐 Что на руках?</button>
        <button class="secondary" onclick="showImportForm()">📁 Импорт данных (текст)</button>
        <button class="secondary" onclick="showSpotQrForm()">🔲 QR-коды для полок</button>
        <button class="secondary" onclick="showHistory()">🕒 История действий</button>
        <button class="secondary" onclick="loadItems()">🔄 Обновить</button>
        <div id="items-list"></div>
    </div>

    <div id="screen-on-hand" class="hidden">
        <h1>На руках</h1>
        <div id="on-hand-list"></div>
        <button class="secondary" onclick="backToMain()">← Назад</button>
    </div>

    <div id="screen-item" class="hidden">
        <h1 id="item-title">Товар</h1>
        <button class="secondary" onclick="showQr()">🔲 Показать QR-код</button>
        <div class="card" id="item-card" style="display:block;"></div>
        <div id="actions"></div>
        <button class="secondary" onclick="backToMain()">← Назад</button>
    </div>

    <div id="screen-add" class="hidden">
        <h1>Новый товар</h1>
        <input id="add-code" placeholder="Код (например, CAM-001)">
        <input id="add-name" placeholder="Название">
        <select id="add-kind">
            <option value="equipment">Оборудование (выдаётся и возвращается)</option>
            <option value="consumable">Расходник (списывается)</option>
        </select>
        <select id="add-location"></select>
        <input id="add-qty" type="number" placeholder="Количество" value="0">
        <input id="add-spot" placeholder="Место (полка/ячейка)">
        <input id="add-min-stock" type="number" placeholder="Мин. остаток (для оповещения)" value="0">
        <div style="margin-bottom:10px;">
            <label style="font-size:14px; color:#555;">Фотография (необязательно):</label>
            <input type="file" id="add-photo" accept="image/*">
        </div>
        <button onclick="saveItem()">Сохранить</button>
        <button class="secondary" onclick="backToMain()">← Назад</button>
    </div>

    <div id="screen-import" class="hidden">
        <h1>Импорт данных</h1>
        <div class="card">
            <p>Скопируйте текст и вставьте в поле.</p>
            <p style="font-size:12px; color:#666;">Формат:<br><code>code;name;kind;location;quantity;spot;min_stock</code></p>
        </div>
        <textarea id="csv-text" rows="10" placeholder="BAT-01;Батарейки;consumable;Склад;50;Ящик 1;10"></textarea>
        <button onclick="submitText()">Загрузить</button>
        <button class="secondary" onclick="backToMain()">← Назад</button>
    </div>

    <div id="screen-spot-qr" class="hidden">
        <h1>QR для полок</h1>
        <input id="spot-name" placeholder="Название полки (например, Т1)">
        <button onclick="generateSpotQr()">Сгенерировать QR</button>
        <div id="spot-qr-result" style="text-align:center; margin-top:20px;"></div>
        <button class="secondary" onclick="backToMain()">← Назад</button>
    </div>

    <div id="screen-history" class="hidden">
        <h1>История</h1>
        <div id="history-list"></div>
        <button class="secondary" onclick="backToMain()">← Назад</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp || {
            ready: () => {}, expand: () => {}, showAlert: (msg) => alert(msg),
            showPopup: (opts, cb) => { if(confirm(opts.message)) cb('open'); },
            initData: "", initDataUnsafe: {}, openLink: (url) => window.open(url, '_blank')
        };
        tg.ready(); tg.expand();

        let currentItem = null;
        let locations = [];
        let allItems = [];

        function notify(msg) { if (tg.showAlert) tg.showAlert(msg); else alert(msg); }

        async function api(path, options = {}) {
            const res = await fetch(path, {
                headers: {
                    ...(options.body instanceof FormData ? {} : { "Content-Type": "application/json" }),
                    "X-Init-Data": tg.initData || "",
                },
                ...options,
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.detail || "Ошибка сервера");
            return data;
        }

        async function loadLocations() {
            locations = await api("/api/locations");
            const opts = locations.map(l => `<option value="${l.id}">${l.name}</option>`).join("");
            document.getElementById("add-location").innerHTML = opts;
        }

        async function loadItems() {
            const list = document.getElementById("items-list");
            list.innerHTML = "<p>Загрузка...</p>";
            try {
                allItems = await api("/api/items");
                filterItems();
            } catch (e) {
                list.innerHTML = `<p style="color:red">${e.message}</p>`;
            }
        }

        function filterItems() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const list = document.getElementById("items-list");
            
            const filtered = allItems.filter(i => 
                i.name.toLowerCase().includes(query) || i.code.toLowerCase().includes(query)
            );

            if (!filtered.length) { list.innerHTML = "<p>Ничего не найдено</p>"; return; }
            
            list.innerHTML = filtered.map(i => `
                <div class="card ${i.is_low ? 'low-stock' : ''}" onclick="openItem('${i.code}')">
                    ${i.photo ? `<img class="thumb" src="data:image/jpeg;base64,${i.photo}">` : `<div class="thumb"></div>`}
                    <div class="info">
                        <div class="name">${i.name}
                            <span class="badge ${i.kind === 'equipment' ? 'eq' : 'cons'}">
                                ${i.kind === 'equipment' ? 'оборуд.' : 'расходник'}
                            </span>
                            ${i.is_low ? '<span style="color:#e74c3c; font-weight:bold; margin-left:5px;">⚠️ Мало!</span>' : ''}
                        </div>
                        <div class="meta">${i.code} · всего: ${i.total} шт (мин: ${i.min_stock})</div>
                        ${i.holders.length ? `<div class="meta" style="color:#e67e22">На руках: ${i.holders.map(h => h.first_name || h.username || h.user_id).join(", ")}</div>` : ""}
                    </div>
                </div>
            `).join("");
        }

        async function showOnHand() {
            showScreen("screen-on-hand");
            const list = document.getElementById("on-hand-list");
            list.innerHTML = "<p>Загрузка...</p>";
            try {
                const rows = await api("/api/on_hand");
                if (!rows.length) { list.innerHTML = "<p>Все вещи на месте!</p>"; return; }
                list.innerHTML = rows.map(r => `
                    <div class="card" onclick="openItem('${r.item_code}')">
                        <div class="info">
                            <div class="name">${r.name} (${r.item_code})</div>
                            <div class="meta" style="color:#e67e22">У ${r.first_name || r.username || r.user_id}</div>
                            <div class="meta">Взято: ${new Date(r.taken_at + 'Z').toLocaleString('ru-RU')}</div>
                        </div>
                    </div>
                `).join("");
            } catch (e) { list.innerHTML = `<p style="color:red">${e.message}</p>`; }
        }

        function scanQr() {
            if (!tg.showScanQrPopup) { notify("Сканер QR доступен только с телефона"); return; }
            tg.showScanQrPopup({ text: "Наведите на QR товара" }, (text) => {
                if (text) { openItem(text.trim()); return true; }
            });
        }

        async function openItem(code) {
            try {
                currentItem = await api(`/api/items/${encodeURIComponent(code)}`);
                document.getElementById("item-title").textContent = currentItem.name;
                
                let photoHtml = currentItem.photo ? 
                    `<img src="data:image/jpeg;base64,${currentItem.photo}" style="width:100%; max-height:200px; object-fit:contain; border-radius:8px; margin-bottom:10px;">` : "";

                document.getElementById("item-card").innerHTML = `
                    ${photoHtml}
                    <div class="meta">Код: ${currentItem.code}</div>
                    <div class="meta">Тип: ${currentItem.kind === 'equipment' ? 'оборудование' : 'расходник'}</div>
                    <div class="meta">Мин. остаток: ${currentItem.min_stock}</div>
                    ${currentItem.stocks.map(s => `
                        <div class="stock-line">
                            <span>${s.location_name}${s.spot ? " · " + s.spot : ""}</span>
                            <strong>${s.quantity} шт</strong>
                        </div>
                    `).join("")}
                    ${currentItem.holders.map(h => `
                        <div class="holder-line">
                            <span style="color:#e67e22">На руках у ${h.first_name || h.username || h.user_id}</span>
                        </div>
                    `).join("")}
                `;
                renderActions();
                showScreen("screen-item");
            } catch (e) { notify(e.message); }
        }

        function renderActions() {
            const box = document.getElementById("actions");
            const isEq = currentItem.kind === "equipment";
            const myId = tg.initDataUnsafe?.user?.id || 1;
            const myCheckout = currentItem.holders.find(h => h.user_id === myId);
            const otherCheckout = currentItem.holders.find(h => h.user_id !== myId);
            let html = "";

            if (isEq) {
                if (myCheckout) {
                    html += `<button class="ok" onclick="doReturn()">✅ Вернуть</button>`;
                } else if (!otherCheckout) {
                    const hasStock = currentItem.stocks.some(s => s.quantity > 0);
                    if (hasStock) html += `<button onclick="doCheckout()">📤 Взять</button>`;
                } else {
                    html += `<div class="card" style="color:#e67e22; display:block;">Вещь у другого сотрудника</div>`;
                }
            } else {
                html += `<h2>Списать</h2>
                    <select id="wo-loc">${currentItem.stocks.filter(s => s.quantity > 0).map(s =>
                        `<option value="${s.location_id}">${s.location_name} (${s.quantity} шт)</option>`).join("")}
                    </select>
                    <input id="wo-qty" type="number" value="1" placeholder="Количество">
                    <button class="danger" onclick="doWriteoff()">📉 Списать</button>`;
            }

            const stockOpts = currentItem.stocks.filter(s => s.quantity > 0)
                .map(s => `<option value="${s.location_id}">${s.location_name} (${s.quantity} шт)</option>`).join("");
            if (stockOpts) {
                html += `<h2>Переместить</h2>
                    <select id="mv-from">${stockOpts}</select>
                    <select id="mv-to">${locations.map(l => `<option value="${l.id}">${l.name}</option>`).join("")}</select>
                    <input id="mv-qty" type="number" value="1" placeholder="Количество">
                    <input id="mv-spot" placeholder="Место на новом (необязательно)">
                    <button class="secondary" onclick="scanSpotQr()">📷 Сканировать полку</button>
                    <button class="secondary" onclick="doMove()">📦 Переместить</button>`;
            }
            box.innerHTML = html;
        }

        function showQr() {
            const url = `/api/qr/${currentItem.code}`;
            document.getElementById("item-card").innerHTML = `
                <div class="meta">Код товара: ${currentItem.code}</div>
                <div style="text-align:center; margin-top:10px;">
                    <img src="${url}" style="width:200px; height:200px; cursor:pointer;" onclick="openQrLink('${url}')" />
                </div>
                <div class="qr-text-box">
                    <div class="label">Текст для создания QR в другом приложении:</div>
                    <div class="value">${currentItem.code}</div>
                </div>
                <p style="font-size:12px; color:#666; text-align:center; margin-top:10px;">Нажмите на картинку, чтобы открыть и распечатать</p>
            `;
            document.getElementById("actions").innerHTML = "";
        }

        function openQrLink(url) { if (tg.openLink) tg.openLink(window.location.origin + url); else window.open(window.location.origin + url, '_blank'); }

        function scanSpotQr() {
            if (!tg.showScanQrPopup) { notify("Сканер QR доступен только с телефона"); return; }
            tg.showScanQrPopup({ text: "Наведите на QR полки" }, (text) => {
                if (text) { document.getElementById("mv-spot").value = text.trim(); return true; }
            });
        }

        function showSpotQrForm() {
            document.getElementById("spot-name").value = "";
            document.getElementById("spot-qr-result").innerHTML = "";
            showScreen("screen-spot-qr");
        }

        function generateSpotQr() {
            const spot = document.getElementById("spot-name").value.trim();
            if (!spot) { notify("Введите название полки"); return; }
            
            const url = `/api/qr/${encodeURIComponent(spot)}`;
            document.getElementById("spot-qr-result").innerHTML = `
                <div style="text-align:center; margin-top:10px;">
                    <img src="${url}" style="width:200px; height:200px; cursor:pointer;" onclick="openQrLink('${url}')" />
                </div>
                <div class="qr-text-box">
                    <div class="label">Текст для создания QR в другом приложении:</div>
                    <div class="value">${spot}</div>
                </div>
            `;
        }

        async function doCheckout() {
            try {
                await api(`/api/checkout?code=${encodeURIComponent(currentItem.code)}`, { method: "POST" });
                notify("Выдано"); openItem(currentItem.code);
            } catch (e) { notify(e.message); }
        }

        async function doReturn() {
            try {
                await api(`/api/return?code=${encodeURIComponent(currentItem.code)}`, { method: "POST" });
                notify("Возвращено"); openItem(currentItem.code);
            } catch (e) { notify(e.message); }
        }

        async function doMove() {
            const from = parseInt(document.getElementById("mv-from").value);
            const to = parseInt(document.getElementById("mv-to").value);
            const qty = parseInt(document.getElementById("mv-qty").value) || 0;
            const spot = document.getElementById("mv-spot").value.trim();
            if (from === to) { notify("Локации должны отличаться"); return; }
            try {
                await api("/api/move", {
                    method: "POST",
                    body: JSON.stringify({ code: currentItem.code, from_location: from, to_location: to, quantity: qty, to_spot: spot }),
                });
                notify("Перемещено"); openItem(currentItem.code);
            } catch (e) { notify(e.message); }
        }

        async function doWriteoff() {
            const loc = parseInt(document.getElementById("wo-loc").value);
            const qty = parseInt(document.getElementById("wo-qty").value) || 0;
            try {
                await api("/api/writeoff", {
                    method: "POST",
                    body: JSON.stringify({ code: currentItem.code, location_id: loc, quantity: qty }),
                });
                notify("Списано"); openItem(currentItem.code);
            } catch (e) { notify(e.message); }
        }

        function showAddForm() { showScreen("screen-add"); }
        function showImportForm() { showScreen("screen-import"); }

        async function saveItem() {
            const code = document.getElementById("add-code").value.trim();
            const name = document.getElementById("add-name").value.trim();
            const kind = document.getElementById("add-kind").value;
            const loc = parseInt(document.getElementById("add-location").value);
            const qty = parseInt(document.getElementById("add-qty").value) || 0;
            const spot = document.getElementById("add-spot").value.trim();
            const minStock = parseInt(document.getElementById("add-min-stock").value) || 0;
            const photoFile = document.getElementById("add-photo").files[0];

            if (!code || !name || !loc) { notify("Заполните код, название и локацию"); return; }

            const formData = new FormData();
            formData.append("code", code);
            formData.append("name", name);
            formData.append("kind", kind);
            formData.append("location_id", loc);
            formData.append("quantity", qty);
            formData.append("spot", spot);
            formData.append("min_stock", minStock);
            if (photoFile) formData.append("photo", photoFile);

            try {
                await api("/api/items", { method: "POST", body: formData });
                notify("Добавлено");
                ["add-code", "add-name", "add-spot", "add-photo"].forEach(id => document.getElementById(id).value = "");
                document.getElementById("add-qty").value = "0";
                document.getElementById("add-min-stock").value = "0";
                backToMain();
            } catch (e) { notify(e.message); }
        }

        async function submitText() {
            const text = document.getElementById("csv-text").value;
            if (!text.trim()) { notify("Вставьте текст"); return; }
            try {
                const res = await api("/api/import_text", {
                    method: "POST",
                    body: JSON.stringify({ text: text })
                });
                notify(`Загружено товаров: ${res.added}`);
                document.getElementById("csv-text").value = "";
                backToMain();
            } catch (e) { notify("Ошибка: " + e.message); }
        }

        async function showHistory() {
            const list = document.getElementById("history-list");
            list.innerHTML = "<p>Загрузка...</p>";
            showScreen("screen-history");
            try {
                const logs = await api("/api/history");
                if (!logs.length) { list.innerHTML = "<p>Пока нет событий</p>"; return; }
                list.innerHTML = logs.map(l => {
                    let text = "";
                    if (l.type === 'checkout') text = `📤 ${l.user_name} взял ${l.name} (${l.quantity} шт)`;
                    if (l.type === 'return') text = `📥 ${l.user_name} вернул ${l.name} (${l.quantity} шт)`;
                    if (l.type === 'move') text = `📦 ${l.user_name} переместил ${l.name} (${l.quantity} шт) из ${l.from_loc || '—'} в ${l.to_loc || '—'}`;
                    if (l.type === 'writeoff') text = `📉 ${l.user_name} списал ${l.name} (${l.quantity} шт) из ${l.from_loc || '—'}`;
                    const dateStr = new Date(l.date + 'Z').toLocaleString('ru-RU');
                    return `<div class="card" style="display:block;"><div class="meta">${dateStr}</div><div>${text}</div></div>`;
                }).join("");
            } catch (e) { list.innerHTML = `<p style="color:red">${e.message}</p>`; }
        }

        function showScreen(id) {
            ["screen-main", "screen-item", "screen-add", "screen-import", "screen-spot-qr", "screen-history", "screen-on-hand"].forEach(s => {
                document.getElementById(s).classList.toggle("hidden", s !== id);
            });
        }
        function backToMain() { showScreen("screen-main"); loadItems(); }

        (async () => { await loadLocations(); await loadItems(); })();
    </script>
</body>
</html>
