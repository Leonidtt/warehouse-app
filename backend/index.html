<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; }
        h1 { font-size: 20px; margin: 0 0 16px; }
        h2 { font-size: 15px; margin: 16px 0 8px; color: #555; }
        button { width: 100%; padding: 14px; margin-bottom: 10px; border: none; border-radius: 10px; font-size: 16px; background: #2AABEE; color: white; cursor: pointer; }
        button.secondary { background: #fff; color: #333; border: 1px solid #ddd; }
        button.danger { background: #e74c3c; }
        button.ok { background: #27ae60; }
        .card { background: #fff; padding: 14px; border-radius: 10px; margin-bottom: 10px; display: flex; gap: 10px; }
        .card .info { flex: 1; }
        .card .name { font-weight: 600; }
        .card .meta { color: #666; font-size: 14px; margin-top: 4px; }
        .card.low-stock { border: 2px solid #e74c3c; background: #fdf2f2; }
        .card.broken { border: 2px solid #e74c3c; opacity: 0.7; }
        .card img.thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; background: #eee; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; background: #fff; }
        .hidden { display: none; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; background: #eee; color: #555; }
        .badge.eq { background: #e3f2fd; color: #1565c0; }
        .badge.cons { background: #fff3e0; color: #e65100; }
        .badge.price { background: #e8f5e9; color: #2e7d32; font-weight: bold; }
        .badge.budget-kc { background: #ffebee; color: #c62828; font-weight: bold; border: 1px solid #ffcdd2; }
        .badge.budget-tx { background: #e8f5e9; color: #2e7d32; font-weight: bold; border: 1px solid #c8e6c9; }
        .search-box { margin-bottom: 10px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 16px;}
        .room-card { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; border-left: 4px solid #2AABEE; }
        .header-nav { display: flex; align-items: center; margin-bottom: 15px; }
        .back-btn { background: #fff; color: #333; border: 1px solid #ddd; padding: 8px 12px; border-radius: 8px; width: auto; margin: 0; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .status-badge { display: inline-block; padding: 8px 12px; border-radius: 8px; font-size: 15px; font-weight: bold; margin-bottom: 15px; width: 100%; box-sizing: border-box; text-align: center; }
        .status-free { background: #e8f5e9; color: #2e7d32; }
        .status-taken { background: #fff3e0; color: #e65100; }
        .status-broken { background: #ffebee; color: #c62828; }
        .kit-box { background: #f0f4c3; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; border-left: 4px solid #cddc39; }
        .report-box { background: #fff; padding: 15px; border-radius: 10px; border-left: 4px solid #ff9800; margin-bottom: 20px; white-space: pre-wrap; font-family: monospace; }
    </style>
</head>
<body>
    <div id="screen-register" class="hidden">
        <h1>Регистрация</h1>
        <div class="input-group"><label>Ваша Фамилия и Имя</label><input id="reg-name" placeholder="Например, Петров Иван"></div>
        <button onclick="doRegister()">Зарегистрироваться</button>
    </div>

    <div id="screen-main" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h1 style="margin:0;">Учёт</h1>
            <span id="user-info" style="font-size:12px; color:#666; text-align:right;"></span>
        </div>
        
        <div id="daily-report-box" class="report-box hidden">
            <b>📊 Сводка за вчера:</b>
            <div id="report-text" style="margin-top:5px;"></div>
        </div>

        <div id="my-bookings-section" class="hidden" style="margin-bottom: 20px;">
            <h2 style="color: #1565c0;">🗓 Мои брони</h2>
            <div id="my-bookings-list"></div>
        </div>

        <button onclick="scanQr()">📷 Сканировать QR</button>
        
        <div id="admin-buttons" class="hidden">
            <button class="secondary" onclick="showAddForm()">➕ Добавить товар</button>
            <button class="secondary" onclick="showImportForm()">📁 Импорт данных</button>
            <button class="secondary" onclick="showSpotQrForm()">🔲 Создать полку</button>
            <button class="secondary" onclick="showSettings()">⚙️ Настройки</button>
            <button class="secondary" onclick="showUsers()">👥 Пользователи</button>
        </div>

        <button class="secondary" onclick="showOnHand()">👀 Все кто взял</button>
        <button class="secondary" onclick="showRooms()">🚪 Что в комнатах?</button>
        <button class="secondary" onclick="showHistory()">🕒 История действий</button>
        <button class="secondary" onclick="loadItems()">🔄 Обновить</button>

        <input class="search-box" type="text" id="search-input" placeholder="🔍 Поиск по названию, коду или S/N..." oninput="filterItems()">
        <div id="items-list"></div>
    </div>

    <!-- ЭКРАН РЕДАКТИРОВАНИЯ -->
    <div id="screen-edit-item" class="hidden">
        <div class="header-nav"><button class="back-btn" onclick="openItem(currentItem.code)">← Назад</button></div>
        <h1>Редактирование</h1>
        <div class="input-group"><label>Название</label><input id="edit-name"></div>
        <div class="input-group"><label>Тип</label><select id="edit-kind"><option value="equipment">Оборудование</option><option value="consumable">Расходник</option></select></div>
        <div class="input-group"><label>Стоимость (для админа)</label><input id="edit-price" type="number" placeholder="0"></div>
        <div class="input-group"><label>Бюджет (для админа)</label><select id="edit-budget-tag"><option value="">Не указан</option><option value="КЦ">КЦ (Красный)</option><option value="ТХ">ТХ (Зеленый)</option></select></div>
        <div class="input-group"><label>Серийный номер (S/N)</label><input id="edit-serial-number"></div>
        
        <h2>Комплектация</h2>
        <div class="input-group"><label>Тушка / Корпус</label><input id="edit-kit-body"></div>
        <div class="input-group"><label>Объектив</label><input id="edit-kit-lens"></div>
        <div class="input-group"><label>Вспышка</label><input id="edit-kit-flash"></div>

        <div id="edit-consumable-fields">
            <div class="input-group"><label>Мин. остаток</label><input id="edit-min-stock" type="number"></div>
        </div>
        <button class="ok" onclick="saveEditItem()">Сохранить</button>
        <button class="danger" onclick="deleteItemFromEdit()" style="margin-top:20px;">🗑 Удалить товар</button>
    </div>

    <!-- ЭКРАН НАСТРОЕК -->
    <div id="screen-settings" class="hidden">
        <div class="header-nav"><button class="back-btn" onclick="backToMain()">← Назад</button></div>
        <h1>Настройки</h1>
        <h2>Комнаты</h2>
        <div class="input-group"><input id="new-location-name" placeholder="Название новой комнаты"></div>
        <button onclick="createLocation()">Добавить комнату</button>
        <div id="locations-list"></div>
        <h2 style="margin-top:30px;">Полки</h2>
        <div id="settings-spots-list"></div>
    </div>

    <div id="screen-users" class="hidden">
        <div class="header-nav"><button class="back-btn" onclick="backToMain()">← Назад</button></div>
        <h1>Пользователи</h1>
        <div id="users-list"></div>
    </div>

    <div id="screen-rooms" class="hidden">
        <div class="header-nav"><button class="back-btn" onclick="backToMain()">← Назад</button></div>
        <h1>Комнаты</h1>
        <div id="rooms-list"></div>
    </div>

    <div id="screen-room-view" class="hidden">
        <div class="header-nav"><button class="back-btn" onclick="showRooms()">← Назад</button></div>
        <h1 id="room-title">Комната</h1>
        <div id="batch-actions" class="hidden" style="background:#fff3e0; padding:10px; border-radius:8px; margin-bottom:10px;">
            <p>Выбрано вещей: <span id="selected-count">0</span></p>
            <button class="secondary" onclick="showBatchMoveForm()">📦 Переместить выбранные</button>
        </div>
        <div id="room-items"></div>
    </div>

    <!-- ОСТАЛЬНЫЕ ЭКРАНЫ -->
    <div id="screen-on-hand" class="hidden"><div class="header-nav"><button class="back-btn" onclick="backToMain()">← Назад</button></div><h1>Все на руках</h1><div id="on-hand-list"></div></div>
    <div id="screen-item" class="hidden"><div class="header-nav"><button class="back-btn" onclick="backToMain()">← Назад</button></div><h1 id="item-title">Товар</h1><button class="secondary" onclick="showQr()">🔲 Показать QR-код</button><button class="ok" onclick="showEditForm()" id="edit-btn">✏️ Редактировать</button><div id="item-status-box"></div><div id="kit-box" class="kit-box hidden"><b>Комплектация:</b><div id="kit-body-text"></div><div id="kit-lens-text"></div><div id="kit-flash-text"></div></div><div id="actions"></div><button class="danger" onclick="markRepair()" id="repair-btn" style="margin-bottom:10px;">🔧 Отметить «Ремонт»</button></div>
    <div id="screen-add" class="hidden"><div class="header-nav"><button class="back-btn" onclick="backToMain()">← Назад</button></div><h1>Новый товар</h1><div class="input-group"><label>Код</label><input id="add-code"></div><div class="input-group"><label>Название</label><input id="add-name"></div><div class="input-group"><label>Тип</label><select id="add-kind" onchange="toggleFields()"><option value="equipment">Оборудование</option><option value="consumable">Расходник</option></select></div><div class="input-group"><label>Локация</label><select id="add-location"></select></div><div class="input-group"><label>Место</label><select id="add-spot"></select></div><div class="input-group"><label>Стоимость</label><input id="add-price" type="number"></div><div class="input-group"><label>Бюджет</label><select id="add-budget-tag"><option value="">Не указан</option><option value="КЦ">КЦ</option><option value="ТХ">ТХ</option></select></div><div class="input-group"><label>S/N</label><input id="add-serial-number"></div><h2>Комплектация</h2><div class="input-group"><label>Тушка</label><input id="add-kit-body"></div><div class="input-group"><label>Объектив</label><input id="add-kit-lens"></div><div class="input-group"><label>Вспышка</label><input id="add-kit-flash"></div><div id="consumable-fields" class="hidden"><div class="input-group"><label>Кол-во</label><input id="add-qty" type="number"></div><div class="input-group"><label>Мин. остаток</label><input id="add-min-stock" type="number"></div></div><button onclick="saveItem()">Сохранить</button></div>
    <div id="screen-import" class="hidden"><div class="header-nav"><button class="back-btn" onclick="backToMain()">← Назад</button></div><h1>Импорт</h1><textarea id="csv-text" rows="10"></textarea><button onclick="submitText()">Загрузить</button></div>
    <div id="screen-spot-qr" class="hidden"><div class="header-nav"><button class="back-btn" onclick="backToMain()">← Назад</button></div><h1>Создать полку</h1><div class="input-group"><input id="spot-name" placeholder="Название"></div><button onclick="createSpot()">Создать</button><div id="spot-qr-result" style="text-align:center; margin-top:20px;"></div></div>
    <div id="screen-history" class="hidden"><div class="header-nav"><button class="back-btn" onclick="backToMain()">← Назад</button></div><h1>История</h1><button class="ok" onclick="downloadHistory()">📥 Скачать в Excel</button><div id="history-list"></div></div>
    <div id="screen-batch-move" class="hidden"><div class="header-nav"><button class="back-btn" onclick="showRooms()">← Назад</button></div><h1>Массовое перемещение</h1><div class="input-group"><label>Куда</label><select id="batch-to-location"></select></div><div class="input-group"><label>Место</label><select id="batch-to-spot"></select></div><button onclick="executeBatchMove()">Переместить выбранные</button></div>

    <script>
        // Инициализация Telegram
        const tg = window.Telegram?.WebApp || { ready: () => {}, expand: () => {}, showAlert: (msg) => alert(msg), initData: "", initDataUnsafe: {}, openLink: (url) => window.open(url, '_blank') };
        tg.ready(); tg.expand();

        let currentItem = null, locations = [], allItems = [], spots = [], currentUser = null, selectedItems = [], currentRoomId = null;

        function notify(msg) { if (tg.showAlert) tg.showAlert(msg); else alert(msg); }

        async function api(path, options = {}) {
            const res = await fetch(path, {
                headers: { ...(options.body instanceof FormData ? {} : { "Content-Type": "application/json" }), "X-Init-Data": tg.initData || "" },
                ...options,
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.detail || "Ошибка");
            return data;
        }

        async function init() {
            try {
                currentUser = await api("/api/me");
                if (!currentUser.full_name) { showScreen("screen-register"); return; }
                document.getElementById("user-info").innerHTML = `${currentUser.full_name}<br><span style="color:#2AABEE">${currentUser.role === 'admin' ? 'Админ' : 'Сотрудник'}</span>`;
                if (currentUser.role === "admin") document.getElementById("admin-buttons").classList.remove("hidden");
                await loadLocations(); await loadSpots(); await loadItems(); await loadDailyReport(); await loadMyBookings();
                showScreen("screen-main");
            } catch (e) { notify("Ошибка инициализации: " + e.message); }
        }

        async function loadDailyReport() {
            try {
                const res = await api("/api/daily_report");
                if (res.report) {
                    document.getElementById("daily-report-box").classList.remove("hidden");
                    document.getElementById("report-text").innerHTML = res.report.replace(/\n/g, '<br>');
                }
            } catch (e) { console.log(e); }
        }

        async function loadMyBookings() {
            try {
                const rows = await api("/api/my_bookings");
                if (!rows.length) return;
                document.getElementById("my-bookings-section").classList.remove("hidden");
                document.getElementById("my-bookings-list").innerHTML = rows.map(r => `<div class="card" style="display:block;"><b>${r.name}</b><div class="meta">${r.date_from} — ${r.date_to}</div></div>`).join("");
            } catch (e) { console.log(e); }
        }

        // ... остальные функции (doRegister, loadLocations, loadSpots, loadItems, filterItems, showRooms, openRoom, showOnHand, scanQr, openItem, showEditForm, saveEditItem, deleteItemFromEdit, renderActions, doCheckout, doReturn, showQr, showSettings, showUsers, showHistory, showImportForm, showAddForm, saveItem, submitText, toggleFields, showBatchMoveForm, executeBatchMove) ...
        // (Вставьте сюда остальные функции из предыдущего рабочего файла, они не изменились)
        
        function showScreen(id) {
            ["screen-register", "screen-main", "screen-item", "screen-add", "screen-import", "screen-spot-qr", "screen-history", "screen-on-hand", "screen-rooms", "screen-room-view", "screen-users", "screen-settings", "screen-edit-item", "screen-batch-move"].forEach(s => {
                const el = document.getElementById(s); if (el) el.classList.toggle("hidden", s !== id);
            });
        }
        function backToMain() { showScreen("screen-main"); loadItems(); }

        (async () => { await init(); })();
    </script>
</body>
</html>
